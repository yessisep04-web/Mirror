son", "Ignore context"], "answer": 1}, {"q": "What should you do when relevant information is missing?", "options": ["Invent the most likely detail", "State what is unknown and seek useful evidence", "Assume the worst", "Stop reasoning entirely"], "answer": 1}, {"q": "Which statement best reflects scientific humility?", "options": ["One example proves the rule", "A useful concept eliminates uncertainty", "Evidence can support a hypothesis without proving every case", "Confidence guarantees accuracy"], "answer": 2}], "retrieval": "Without looking back, explain the main idea of Observation vs. Interpretation in your own words and give one example.", "reflection": "Where could this concept help you notice, communicate, or practice differently?", "practice": "Try one small, low-risk application today. Record what you expected, what you observed, and what you learned.", "resources": [["Reference", "OpenStax Psychology 2e", "https://openstax.org/details/books/psychology-2e"], ["Learning science", "The Learning Scientists", "https://www.learningscientists.org/"], ["APA", "American Psychological Association", "https://www.apa.org/"]]}, {"day": 3, "track": "Core Foundations", "title": "Hypotheses, Evidence & Updating", "description": "Treat explanations as testable hypotheses rather than conclusions.", "minutes": 13, "objectives": ["state a hypothesis", "identify supporting and disconfirming evidence", "update confidence"], "read": "A hypothesis is a proposed explanation that can be examined. Good reasoning asks what would support it, what would challenge it, and what alternatives exist. Confidence should change when relevant evidence changes.", "key": "Hypotheses, Evidence & Updating: a concept for accurate observation, hypothesis testing, and deliberate practice.", "research": "Evidence note: apply the concept cautiously, distinguish research evidence from personal reflection, and avoid treating one example as proof of a general causal claim.", "example": "Instead of X definitely caused Y, use Maybe X contributed to Y and identify what you would expect if that explanation were useful.", "scenario": "Choose one recent assumption. Write the hypothesis, supporting evidence, possible challenges, and what information you want next.", "quiz": [{"q": "Which approach best fits hypotheses, evidence & updating?", "options": ["Treat the first explanation as certain", "Describe evidence, alternatives, and uncertainty", "Use the concept to diagnose a person", "Ignore context"], "answer": 1}, {"q": "What should you do when relevant information is missing?", "options": ["Invent the most likely detail", "State what is unknown and seek useful evidence", "Assume the worst", "Stop reasoning entirely"], "answer": 1}, {"q": "Which statement best reflects scientific humility?", "options": ["One example proves the rule", "A useful concept eliminates uncertainty", "Evidence can support a hypothesis without proving every case", "Confidence guarantees accuracy"], "answer": 2}], "retrieval": "Without looking back, explain the main idea of Hypotheses, Evidence & Updating in your own words and give one example.", "reflection": "Where could this concept help you notice, communicate, or practice differently?", "practice": "Try one small, low-risk application today. Record what you expected, what you observed, and what you learned.", "resources": [["Reference", "OpenStax Psychology 2e", "https://openstax.org/details/books/psychology-2e"], ["Learning science", "The Learning Scientists", "https://www.learningscientists.org/"], ["APA", "American Psychological Association", "https://www.apa.org/"]]}, {"day": 4, "track": "Core Foundations", "title": "Context Changes Behavior", "description": "Learn why behavior should be interpreted in context.", "minutes": 12, "objectives": ["identify situational variables", "avoid overly dispositional explanations", "compare person and situation factors"], "read": "Behavior occurs in contexts. Time pressure, incentives, social roles, ition: Think About Your Thinking in your own words and give one example.", "reflection": "Where could this concept help you notice, communicate, or practice differently?", "practice": "Try one small, low-risk application today. Record what you expected, what you observed, and what you learned.", "resources": [["Reference", "OpenStax Psychology 2e", "https://openstax.org/details/books/psychology-2e"], ["Learning science", "The Learning Scientists", "https://www.learningscientists.org/"], ["APA", "American Psychological Association", "https://www.apa.org/"]]}, {"day": 6, "track": "Core Foundations", "title": "Emotion, Thought, Urge & Action", "description": "Separate internal experiences from the behavior that follows them.", "minutes": 13, "objectives": ["distinguish emotion from thought", "distinguish urge from action", "map a response sequence"], "read": "An emotion, thought, urge, and action are related but different events. I feel angry describes an emotion; they disrespected me is an interpretation; I want to send a message is an urge; sending it is an action. Separating them creates a point where behavior can be chosen.", "key": "Emotion, Thought, Urge & Action: a concept for accurate observation, hypothesis testing, and deliberate practice.", "research": "Evidence note: apply the concept cautiously, distinguish research evidence from personal reflection, and avoid treating one example as proof of a general causal claim.", "example": "Feeling an urge to respond immediately does not require immediate action.", "scenario": "Recall a strong reaction and label situation, thought, emotion, urge, action, and consequence separately.", "quiz": [{"q": "Which approach best fits emotion, thought, urge & action?", "options": ["Treat the first explanation as certain", "Describe evidence, alternatives, and uncertainty", "Use the concept to diagnose a person", "Ignore context"], "answer": 1}, {"q": "What should you do when relevant information is missing?", "options": ["Invent the most likely detail", "State what is unknown and seek useful evidence", "Assume the worst", "Stop reasoning entirely"], "answer": 1}, {"q": "Which statement best reflects scientific humility?", "options": ["One example proves the rule", "A useful concept eliminates uncertainty", "Evidence can support a hypothesis without proving every case", "Confidence guarantees accuracy"], "answer": 2}], "retrieval": "Without looking back, explain the main idea of Emotion, Thought, Urge & Action in your own words and give one example.", "reflection": "Where could this concept help you notice, communicate, or practice differently?", "practice": "Try one small, low-risk application today. Record what you expected, what you observed, and what you learned.", "resources": [["Reference", "OpenStax Psychology 2e", "https://openstax.org/details/books/psychology-2e"], ["Learning science", "The Learning Scientists", "https://www.learningscientists.org/"], ["APA", "American Psychological Association", "https://www.apa.org/"]]}, {"day": 7, "track": "Core Foundations", "title": "Uncertainty Is Information", "description": "Practice thinking and communicating without false precision.", "minutes": 11, "objectives": ["use calibrated language", "identify missing information", "state what you do not know"], "read": "Uncertainty is part of reasoning whenever information is incomplete. Useful language includes I remember, I think, I am not sure, I need to verify, and I learned this later. Precision means matching claim strength to evidence.", "key": "Uncertainty Is Information: a concept for accurate observation, hypothesis testing, and deliberate practice.", "research": "Evidence note: apply the concept cautiously, distinguish research evidence from personal reflection, and avoid treating one example as proof of a general causal claim.", "example": "I remember it being around 4 is different from claiming it happened at exactly 4.", "scenario": "Rewrite three overly certain statements so they a function shell(content,active){app.innerHTML=`<header class="top"><button class="brand" onclick="go('home')"><span class="brand-mark">M</span> Mirror</button><span class="meta">Psychology learning lab</span></header><main>${content}</main><nav class="nav">${navItems.map(n=>`<button class="${active===n[0]?"active":""}" onclick="go('${n[0]}')"><span class="nav-icon">${n[1]}</span>${n[2]}</button>`).join("")}</nav>`;window.scrollTo(0,0)}
function go(page,arg){try{({home,learn,progress:progressPage,analyze,stop:stopPage,people,communicate,library}[page]||home)(arg)}catch(e){errorPage(e)}}
function home(){const next=LESSONS.find(x=>!state.completed.includes(x.day))||LESSONS[0],d=LESSONS[(state.dailyIndex||0)%LESSONS.length];shell(`<section class="hero"><div class="eyebrow">Mirror, mirror on the wall…</div><h1>See yourself clearly. Act deliberately.</h1><p>Not to judge yourself. To learn how to observe behavior, test assumptions, communicate accurately, and update what you believe.</p><div class="actions"><button class="btn" onclick="openLesson(${next.day})">Continue Day ${next.day} →</button><button class="btn secondary" onclick="go('analyze')">Analyze a situation</button></div></section><div class="section-title"><h2>Your learning loop</h2></div><div class="card"><strong>Learn → Test → Apply → Reflect → Review → Update</strong><p class="meta">Mirror is a continuing course, not a 30-day challenge.</p><div class="progressbar"><span style="width:${pct()}%"></span></div><p class="meta">${state.completed.length} of ${LESSONS.length} core lessons completed · ${pct()}%</p></div><div class="grid"><div class="card"><span class="kicker">Today’s reflection</span><h3>${esc(d.title)}</h3><p>${esc(d.reflection)}</p><button class="btn secondary" onclick="openLesson(${d.day})">Reflect with Day ${d.day}</button></div><div class="card"><span class="kicker">Practice</span><h3>Observe before explaining</h3><p>Separate what happened from what you think it means. Generate alternatives before choosing an explanation.</p><button class="btn secondary" onclick="go('people')">Try People Analyzer</button></div></div><div class="section-title"><h2>Tracks</h2></div><div class="grid">${[...new Set(LESSONS.map(x=>x.track))].map(t=>`<button class="clickable" onclick="go('learn','${encodeURIComponent(t)}')"><span class="badge">${esc(t)}</span><h3>${LESSONS.filter(x=>x.track===t).length} lessons</h3><span class="meta">Explore the concepts and practice them in context.</span></button>`).join("")}</div>`,"home")}
function learn(filter){const f=filter?decodeURIComponent(filter):"",list=f?LESSONS.filter(x=>x.track===f):LESSONS;shell(`<div class="section-title"><div><div class="eyebrow">The Academy</div><h1>Learn</h1><p class="meta">Every card is a working lesson. Completed lessons remain available for review.</p></div></div><div class="actions"><button class="btn" onclick="go('learn')">All</button>${[...new Set(LESSONS.map(x=>x.track))].map(t=>`<button class="btn secondary" onclick="go('learn','${encodeURIComponent(t)}')">${esc(t)}</button>`).join("")}</div><div class="lesson-grid">${list.map(x=>`<button class="clickable lesson-card" onclick="openLesson(${x.day})"><span class="badge">DAY ${x.day} · ${esc(x.track)}</span><h3>${esc(x.title)}</h3><span class="meta">${esc(x.description)}</span><div class="bottom"><span class="meta">${x.minutes} min</span><span class="${state.completed.includes(x.day)?"done":""}">${state.completed.includes(x.day)?"✓ Completed · Review":"Start →"}</span></div></button>`).join("")}</div>`,"learn")}
function openLesson(day){const x=LESSONS.find(l=>l.day===Number(day));if(!x)return errorPage(new Error("Lesson not found"));const reflection=state.reflections[x.day]||"",q=state.quiz[x.day]||{};app.innerHTML=`<header class="top"><button class="btn secondary" onclick="go('learn')">← Lessons</button><span class="meta">Day ${x.day} / ${LESSONS.length}</span></header><main><section class="lesson-head"><span class="badge">${esc(x.track)} · ${x.minutes} min</span><h1>Day ${x.day} — ${esc(x.title)}</h1><p>${esc(x.description)}</p></section><div class="lesson-body"><article class="card reading"><div class="kicker">1 · Read</div><h2>Learning objectives</h2><ul>${x.objectives.map(o=>`<li>${esc(o)}</li>`).join("")}</ul><h2>Lesson</h2><p>${esc(x.read)}</p><div class="callout"><strong>Key concept</strong><p>${esc(x.key)}</p></div><h2>What the evidence can and cannot tell you</h2><p>${esc(x.research)}</p><h2>Example</h2><p>${esc(x.example)}</p><h2>Scenario</h2><p>${esc(x.scenario)}</p><div class="kicker">2 · Knowledge check</div>${x.quiz.map((qq,i)=>`<div class="card" style="margin-top:10px"><strong>${i+1}. ${esc(qq.q)}</strong>${qq.options.map((o,j)=>`<button class="quiz-option ${q[i]===j?(j===qq.answer?"correct":"wrong"):""}" onclick="answerQuiz(${x.day},${i},${j})">${esc(o)}</button>`).join("")}${q[i]!==undefined?`<p class="meta">${q[i]===qq.answer?"Correct.":"Not quite. The strongest answer preserves evidence and uncertainty."}</p>`:""}</div>`).join("")}<h2>Retrieval</h2><div class="notice">${esc(x.retrieval)}</div><p class="meta">Try answering before looking back.</p><label for="reflection">Journal from this lesson</label><textarea id="reflection" placeholder="Write your observation, application, or question...">${esc(reflection)}</textarea><div class="actions"><button class="btn" onclick="saveReflection(${x.day})">Save reflection</button><button class="btn secondary" onclick="completeLesson(${x.day})">Mark complete</button></div><h2>Practice</h2><p>${esc(x.practice)}</p></article><aside><div class="card"><div class="kicker">Apply</div><p>${esc(x.reflection)}</p><p>${esc(x.practice)}</p></div><div class="card"><div class="kicker">Resources</div>${x.resources.map(r=>`<p><span class="badge">${esc(r[0])}</span><br><a href="${esc(r[2])}" target="_blank" rel="noopener">${esc(r[1])} ↗</a></p>`).join("")}</div></aside></div></main><nav class="nav">${navItems.map(n=>`<button onclick="go('${n[0]}')"><span class="nav-icon">${n[1]}</span>${n[2]}</button>`).join("")}</nav>`;window.scrollTo(0,0)}
function answerQuiz(day,i,j){state.quiz[day]=state.quiz[day]||{};state.quiz[day][i]=j;save();openLesson(day)}
function saveReflection(day){state.reflections[day]=document.getElementById("reflection").value;save();openLesson(day)}
function completeLesson(day){if(!state.completed.includes(Number(day)))state.completed.push(Number(day));save();openLesson(day)}
function analyze(){shell(`<div class="eyebrow">Personal laboratory</div><h1>Incident Analyzer</h1><p class="meta">Describe behavior without assuming a single cause. Educational tool, not a clinical assessment.</p><div class="card">${["Situation","Antecedent — what happened immediately before?","Observable behavior — what did you actually do?","Thoughts — what was going through your mind?","Emotion — what did you experience?","Urge — what did you want to do?","Action — what did you actually do?","Immediate consequence","Short-term reward or relief","Long-term cost","Alternative behavior","Pattern — has this happened before?"].map((l,i)=>`<label>${l}</label><textarea id="inc${i}" placeholder="Write what is useful; uncertainty is allowed."></textarea>`).join("")}<button class="btn" onclick="saveIncident()">Save incident locally</button> <button class="btn secondary" onclick="showSavedIncidents()">View saved incidents</button></div>`,"analyze")}
function saveIncident(){const vals=[...document.querySelectorAll('[id^="inc"]')].map(x=>x.value),arr=JSON.parse(localStorage.getItem("mirror.incidents")||"[]");arr.unshift({date:new Date().toISOString(),values:vals});localStorage.setItem("mirror.incidents",JSON.stringify(arr));alert("Incident saved locally in this browser.")}
function showSavedIncidents(){const arr=JSON.parse(localStorage.getItem("mirror.incidents")||"[]");shell(`<h1>Saved incidents</h1><p class="meta">${arr.length} saved locally.</p>${arr.length?arr.map((a,i)=>`<div class="card"><strong>Incident ${i+1}</strong><p class="meta">${new Date(a.date).toLocaleString()}</p><details><summary>Open</summary>${a.values.map((v,j)=>v?`<p><strong>${["Situation","Antecedent","Behavior","Thoughts","Emotion","Urge","Action","Immediate consequence","Short-term reward","Long-term cost","Alternative behavior","Pattern"][j]}</strong><br>${esc(v)}</p>`:"").join("")}</details></div>`).join(""):'<div class="empty">No incidents saved yet.</div>'}<button class="btn secondary" onclick="go('analyze')">← Analyzer</button>`,"analyze")}
function stopPage(){shell(`<div class="eyebrow">Pause protocol</div><h1>STOP</h1><p class="meta">Create distance between an impulse and an action.</p><div class="grid">${[["S","Stop","Do not immediately act. What are you about to do?"],["T","Take a step back","What would change if you waited?"],["O","Observe","What is happening externally? What are you thinking, feeling, and wanting?"],["P","Proceed mindfully","What action fits the evidence, your values, and likely consequences?"]].map(x=>`<div class="card"><span class="badge">${x[0]}</span><h2>${x[1]}</h2><p>${x[2]}</p><textarea placeholder="Your answer..."></textarea></div>`).join("")}</div>`,"stop")}
function people(){shell(`<div class="eyebrow">Social reasoning</div><h1>People Analyzer</h1><p class="meta">You can observe behavior; you cannot directly observe another person's private mental state.</p><div class="card">${["What the person actually did","What they actually said","Context","What I think it means","Evidence supporting that interpretation","Evidence against it","Alternative explanations","What I don't know","What question could clarify this?","How confident am I? (0–100%)"].map((l,i)=>`<label>${l}</label>${i===9?'<input type="range" min="0" max="100" value="50" oninput="this.nextElementSibling.textContent=this.value+'%'"><span>50%</span>':'<textarea placeholder="Keep observation and interpretation separate."></textarea>'}`).join("")}<div class="callout"><strong>Reasoning sequence</strong><p>Observe → generate hypotheses → consider context → seek evidence → ask when appropriate → update.</p></div></div>`,"people")}
function communicate(){shell(`<div class="eyebrow">Communication Psychology</div><h1>Communicate</h1><p class="meta">A continuing course and practical lab for accurate, clear, accountable communication.</p><div class="grid"><div class="card"><h2>Clarity Formula</h2><p><strong>Fact → uncertainty → correction → current understanding → question</strong></p><p class="meta">What I know is ___. I was unsure about ___. Earlier I said ___. I have since learned ___. What I want to clarify is ___.</p><button class="btn" onclick="clarityLab()">Open Lab</button></div><div class="card"><h2>Communication course</h2><p>Practice specificity, uncertainty, listening, difficult conversations, boundaries, repair, and perspective-taking.</p><button class="btn secondary" onclick="go('learn','People%20%26%20Communication')">Open communication lessons</button></div></div><div class="section-title"><h2>Memory and changing details</h2></div><div class="card"><p>A changed detail does not automatically establish intentional deception. Memory can be incomplete or reconstructive; information can be learned later; wording can be ambiguous; circumstances can change. Accurate communication means distinguishing what you remember, infer, learned later, and need to verify.</p></div>`,"communicate")}
function clarityLab(){shell(`<div class="eyebrow">Communication Lab</div><h1>Clarity Formula</h1><p class="meta">Build a correction or clarification without hiding uncertainty.</p><div class="card">${["What I know","What I am uncertain about","What changed","What I said earlier","What I know now","What I want the other person to understand","What I need to verify","What I think","What I don't know","What question I need to ask"].map(l=>`<label>${l}</label><textarea></textarea>`).join("")}<div class="callout"><strong>Structure</strong><p>Fact → uncertainty → correction → current understanding → question.</p></div></div>`,"communicate")}
function progressPage(){const answered=Object.values(state.quiz).reduce((a,q)=>a+Object.keys(q).length,0),refs=Object.keys(state.reflections).length;shell(`<div class="eyebrow">Learning record</div><h1>Progress</h1><div class="grid"><div class="card"><span class="kicker">Lessons</span><h2>${state.completed.length} / ${LESSONS.length}</h2><div class="progressbar"><span style="width:${pct()}%"></span></div></div><div class="card"><span class="kicker">Reflections</span><h2>${refs}</h2><p class="meta">Journal entries linked to lessons.</p></div><div class="card"><span class="kicker">Quiz questions attempted</span><h2>${answered} / ${LESSONS.length*3}</h2><p class="meta">Activity measures learning practice, not personal worth.</p></div></div><div class="section-title"><h2>Data</h2></div><div class="card"><p>Lesson progress and reflections are stored in this browser using localStorage. They are not written into the website repository.</p><div class="actions"><button class="btn" onclick="exportData()">Export JSON</button><button class="btn secondary" onclick="importData()">Import JSON</button></div></div>`,"progress")}
function exportData(){const payload={version:1,mirror:state,incidents:JSON.parse(localStorage.getItem("mirror.incidents")||"[]")},blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mirror-data.json";a.click();URL.revokeObjectURL(a.href)}
function importData(){const input=document.createElement("input");input.type="file";input.accept=".json,application/json";input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(!p.mirror)throw new Error("Invalid Mirror export");Object.assign(state,p.mirror);save();if(p.incidents)localStorage.setItem("mirror.incidents",JSON.stringify(p.incidents));progressPage()}catch(e){alert("Mirror could not import that file: "+e.message)}};r.readAsText(f)};input.click()}
function library(){shell(`<div class="eyebrow">Reference shelf</div><h1>Library</h1><p class="meta">Starting points for psychology and learning science.</p><div class="grid">${[["OpenStax Psychology 2e","Open textbook covering major psychology foundations.","https://openstax.org/details/books/psychology-2e"],["American Psychological Association","Professional organization and psychology education resources.","https://www.apa.org/"],["The Learning Scientists","Evidence-informed learning strategies and study resources.","https://www.learningscientists.org/"],["Motivational Interviewing Network of Trainers","Training and educational resources around motivational interviewing.","https://motivationalinterviewing.org/"]].map(x=>`<a class="clickable" href="${x[2]}" target="_blank" rel="noopener"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p><span class="done">Open resource ↗</span></a>`).join("")}</div><div class="card" style="margin-top:16px"><strong>Source discipline</strong><p>Distinguish established research, theoretical explanations, practical heuristics, and personal reflection. For research articles, record author, year, publication, design, main finding, limitations, and link.</p></div>`,"library")}
function errorPage(e){shell(`<div class="card"><h1>Mirror couldn’t open this page.</h1><p>Something went wrong loading the requested content.</p><p class="meta">${esc(e&&e.message||"Unknown error")}</p><button class="btn" onclick="go('learn')">Return to lessons</button></div>`,"learn")}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
go("home");
</script></body></html>
